<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maartec Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#E0531F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maartec">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E0531F; --brand-2:#B8400F; --brand-soft:#FCE9DF; --slate:#2F3437; --slate-2:#5B6266;
  --bg:#F6F4F1; --surface:#FFFFFF; --paper:#FAF8F5; --ink:#1F2326; --muted:#62696E; --line:#E7E2DB;
  --ok:#2E7A4E; --ok-soft:#DFEFE5; --warn:#9A620E; --warn-soft:#F7EAD2; --red:#B4372B; --red-soft:#F8E1DD;
  --s1:#E0531F; --s2:#2F6FA8; --grid:#ECE8E2;
  --shadow:0 1px 0 rgba(31,35,38,.04), 0 10px 26px -18px rgba(31,35,38,.35);
  --ff-h:Poppins,Inter,system-ui,sans-serif; --ff:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#EC6A3C; --brand-2:#F28A62; --brand-soft:#3A2419; --slate:#2A2E31; --slate-2:#3A3F43;
    --bg:#131516; --surface:#1B1D1F; --paper:#17191B; --ink:#EEEAE5; --muted:#A3A9AE; --line:#2D3134;
    --ok:#7CC79A; --ok-soft:#1D3327; --warn:#E3B465; --warn-soft:#382C17; --red:#EE8A7D; --red-soft:#3A201C;
    --s1:#E8673A; --s2:#4A8FD0; --grid:#25292C; --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#EC6A3C; --brand-2:#F28A62; --brand-soft:#3A2419; --slate:#2A2E31; --slate-2:#3A3F43;
  --bg:#131516; --surface:#1B1D1F; --paper:#17191B; --ink:#EEEAE5; --muted:#A3A9AE; --line:#2D3134;
  --ok:#7CC79A; --ok-soft:#1D3327; --warn:#E3B465; --warn-soft:#382C17; --red:#EE8A7D; --red-soft:#3A201C;
  --s1:#E8673A; --s2:#4A8FD0; --grid:#25292C; --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ff);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--ff-h);font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
a{color:var(--brand)}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--surface) 231px,var(--line) 231px,var(--line) 232px,transparent 232px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:24px 16px 18px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font:700 17px/1.1 var(--ff-h);letter-spacing:.06em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;justify-content:space-between;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav button span.l{display:flex;align-items:center;gap:10px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-2);font-weight:600}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--brand-2)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.save{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:0 6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.save.busy i{background:var(--warn);animation:pulse 1s infinite}
.save.err i{background:var(--red)}
.save span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{opacity:.35}}
.linkbtn{border:0;background:none;padding:4px 6px;color:var(--muted);text-align:left;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
main{padding:28px clamp(16px,3.2vw,40px) 64px;min-width:0;max-width:1320px;width:100%}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:20px}
.top h1{margin:0;font-size:clamp(22px,2.6vw,28px);line-height:1.15}
.top p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--slate-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
:root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .btn.primary:hover{color:#1a0f09}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0f09}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.small{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.month{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);height:38px}
.month button{border:0;background:none;width:34px;height:36px;color:var(--muted);font-size:18px}
.month button:hover{color:var(--ink)}
.month b{min-width:132px;text-align:center;font:600 14px var(--ff-h);text-transform:capitalize}

/* painéis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .lb{font-size:12.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:600 clamp(20px,2.2vw,26px)/1.2 var(--ff-h);margin:6px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:#fff}
.kpi.hl .lb,.kpi.hl .d{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .kpi.hl{color:#1a0f09}:root[data-theme="dark"] .kpi.hl .lb,:root[data-theme="dark"] .kpi.hl .d{color:rgba(26,15,9,.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.hl{color:#1a0f09}:root:not([data-theme="light"]) .kpi.hl .lb,:root:not([data-theme="light"]) .kpi.hl .d{color:rgba(26,15,9,.8)}}
.pos{color:var(--ok)} .neg{color:var(--red)}
.kpi.hl .pos,.kpi.hl .neg{color:inherit}
.stack{display:flex;flex-direction:column;gap:16px}
.mt{margin-top:16px}

/* tabela estilo planilha Maartec */
.sheet{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.sheet th,.sheet td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.sheet thead th{background:var(--slate);color:#fff;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.sheet thead th:first-child{border-top-left-radius:10px}.sheet thead th:last-child{border-top-right-radius:10px}
.sheet .r{text-align:right}
.sheet tfoot td{background:var(--brand-soft);font-weight:600;border-bottom:0}
.sheet tfoot td:first-child{border-bottom-left-radius:10px}.sheet tfoot td:last-child{border-bottom-right-radius:10px}
.sheet tr.tot td{background:var(--brand);color:#fff;font-weight:600;border-bottom:0}
:root[data-theme="dark"] .sheet tr.tot td{color:#1a0f09}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet tr.tot td{color:#1a0f09}}
.sheet tbody tr.click{cursor:pointer}
.sheet tbody tr.click:hover td{background:var(--paper)}
.sheet td.lbl{color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tablewrap .sheet thead th{border-radius:0}
.tablewrap .sheet{min-width:760px}
.tablewrap .sheet tbody tr:last-child td{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.pago{background:var(--ok-soft);color:var(--ok)}
.chip.aberto{background:var(--warn-soft);color:var(--warn)}
.chip.atrasado{background:var(--red-soft);color:var(--red)}
.chip.parcial{background:var(--warn-soft);color:var(--warn)}
.tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:transparent;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:14px;height:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tag.fab{background:var(--brand-soft);color:var(--brand-2);border-color:transparent}

/* barras de categoria */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.cat .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--paper);overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--slate-2);border-radius:4px}
:root[data-theme="dark"] .cat .bar i{background:#6B737A}

/* gráfico */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:8px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s;z-index:2}
.tip.on{opacity:1}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.fl.grow{flex:1 1 220px}
.fl input,.fl select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;color:var(--ink);font-size:14px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);height:38px}
.seg button{border:0;background:none;padding:0 12px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--slate);color:#fff}

/* lançamento rápido */
.quick{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 150px 130px auto auto;gap:8px;align-items:end;margin-bottom:16px}
.quick input,.quick select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;width:100%}
.split{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.quick label.chk input{width:18px;height:18px}
.quick label.chk{display:flex;align-items:center;gap:6px;height:40px;font-size:14px;white-space:nowrap}

/* vazio / pin */
.empty{text-align:center;padding:44px 22px}
.empty h3{font-size:19px;margin:0 0 6px}
.empty p{color:var(--muted);max-width:520px;margin:0 auto 18px}
.empty .actions{justify-content:center}
.pin-box{max-width:420px;margin:8vh auto 0}
.pin-box svg{width:72px;height:72px;margin-bottom:6px}
.pin-box form{display:flex;flex-direction:column;gap:10px;margin-top:10px;text-align:left}
.pin-box input[type=password],.pin-box input[type=url]{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-size:16px}
.pin-box input#pin{text-align:center;letter-spacing:.4em;font-size:20px}
.pin-box .err{min-height:20px;color:var(--red);font-size:13.5px;margin:0;text-align:center}
.pin-box .lembrar{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.pin-box .btn{height:46px;justify-content:center;font-size:15px}
.pin-box .alt{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:center}
body.is-locked .side .nav,body.is-locked .side .save{visibility:hidden}
.bar-note{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin-bottom:16px}
.bar-note.info{background:var(--brand-soft);color:var(--brand-2)}

/* anexos */
.anx{display:flex;flex-direction:column;gap:8px;color:var(--ink);font-weight:400}
.anx.busy{opacity:.6;pointer-events:none}
.anx-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.anx-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;flex-wrap:wrap}
.anx-list li+li{border-top:1px solid var(--line)}
.anx-list .nm{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.anx-list .acts{display:flex;gap:4px;margin-left:auto}
.anx-add{display:flex;flex-wrap:wrap;gap:6px}
.anx-add .btn{cursor:pointer}
.anx-chips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.anx-chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;font-size:11.5px;font-weight:600;padding:2px 7px}
.anx-chip:hover{border-color:var(--brand);color:var(--brand-2)}
.anx-chip svg{width:12px;height:12px}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,22,24,.45);backdrop-filter:blur(2px)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:18px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);width:36px;height:36px;border-radius:8px}
.x:hover{background:var(--paper)}
.dlg-body{padding:18px 22px;overflow:auto;display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot .left{margin-right:auto}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.f.full,.full{grid-column:1/-1}
.f input,.f select,.f textarea{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;color:var(--ink);font-size:15px;width:100%}
.f textarea{height:auto;min-height:64px;padding:9px 11px;resize:vertical}
.f .hint{font-weight:400;font-size:12px}
.radios{display:flex;gap:8px}
.radios label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2)}
.parc{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;overflow:auto}
.parc table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.parc th{background:var(--paper);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 8px;text-transform:uppercase;letter-spacing:.03em}
.parc td{padding:6px 6px;border-top:1px solid var(--line)}
.parc input{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;width:100%;font-size:14px}
.parc input[type=checkbox]{width:18px;height:18px}
.parc .sum{display:flex;justify-content:space-between;padding:8px 10px;font-size:13px;background:var(--paper);border-top:1px solid var(--line)}
.parc .sum.bad{color:var(--red)}
.cfm{width:min(440px,calc(100vw - 24px))}
.cfm .dlg-body{display:block}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ocultar valores */
body.discreto .money{filter:blur(7px);user-select:none}

/* relatório (balanço para imprimir) */
#rep{position:fixed;inset:0;z-index:40;background:rgba(20,22,24,.6);overflow:auto;padding:24px 12px}
#rep .rep-bar{max-width:860px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#rep .rep-bar .btn{background:#fff;color:#1F2326;border-color:#fff}
#rep .rep-bar .btn.primary{background:#E0531F;border-color:#E0531F;color:#fff}
.rp{max-width:860px;margin:0 auto;background:#fff;color:#1F2326;padding:40px 44px;border-radius:6px;font:400 13px/1.45 Inter,system-ui,sans-serif}
.rp *{box-sizing:border-box}
.rp .hd{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.rp .mesbox{border:2px solid #2F3437;width:92px;text-align:center}
.rp .mesbox b{display:block;background:#2F3437;color:#fff;padding:6px 0;font:600 14px Poppins,sans-serif}
.rp .mesbox span{display:block;padding:6px 2px;font-size:10.5px;font-weight:600;text-transform:uppercase}
.rp .title{background:#F28C28;color:#fff;font:600 28px Poppins,sans-serif;padding:8px 22px;border-radius:12px}
.rp .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
.rp h4{font:500 15px Poppins,sans-serif;margin:16px 0 8px}
.rp h4.pill{display:inline-block;background:#F28C28;color:#fff;padding:3px 12px;border-radius:8px;font-size:14px}
.rp h4.pill.red{background:#C8324A}
.rp table{width:100%;border-collapse:collapse;margin-bottom:6px}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><!--LOGO--><div><b>MAARTEC</b><small>Financeiro</small></div></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>

<script>
(function(){
"use strict";
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl = v => BRL.format(+v || 0);
const m$ = v => `<span class="money num">${brl(v)}</span>`;
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtD = s => { const d = parseD(s); return d ? pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear() : "—"; };
const fmtDc = s => { const d = parseD(s); return d ? pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + String(d.getFullYear()).slice(2) : "—"; };
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesNome = k => { const [y,m] = k.split("-").map(Number); return MESES[m-1] + " " + y; };
const mesCurto = k => { const [y,m] = k.split("-").map(Number); return MES3[m-1] + "/" + String(y).slice(2); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonthsK = (k, n) => { const [y,m] = k.split("-").map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear() + "-" + pad(d.getMonth()+1); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };
const firstDay = k => k + "-01";
const lastDay = k => { const [y,m] = k.split("-").map(Number); return k + "-" + pad(new Date(y, m, 0).getDate()); };
const monthsIn = (a, b) => { const out = []; let k = a.slice(0,7); const e = b.slice(0,7); let g = 0; while (k <= e && g++ < 240){ out.push(k); k = addMonthsK(k, 1); } return out; };
const inR = (s, a, b) => !!s && s >= a && s <= b;
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const r2 = v => Math.round((+v || 0) * 100) / 100;
const num = v => {
  if (typeof v === "number") return v;
  v = String(v||"").replace(/[R$\s]/g,"").trim(); if (!v) return 0;
  if (v.includes(",")) v = v.replace(/\./g,"").replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,"");
  return parseFloat(v) || 0;
};
const fmtN = v => (+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
const norm = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const byName = (a, b) => a.nome.localeCompare(b.nome, "pt-BR", {sensitivity:"base"});
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400); }
function ask(msg, ok, perigo = true){
  return new Promise(res => {
    const d = $("#cfm");
    d.innerHTML = `<div class="dlg-body"><h2 style="margin:0 0 8px;font-size:18px">${esc(msg)}</h2><p style="margin:0;color:var(--muted)">${perigo ? "O item vai para a lixeira e pode ser restaurado por 30 dias." : ""}</p></div><div class="dlg-foot"><button type="button" class="btn ghost" data-c="0">Cancelar</button><button type="button" class="btn primary" data-c="1" ${perigo ? 'style="background:var(--red);border-color:var(--red)"' : ""}>${esc(ok || "Excluir")}</button></div>`;
    const done = v => { d.close(); res(v); };
    d.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); done(b.dataset.c === "1"); }));
    d.addEventListener("cancel", () => res(false), {once:true});
    d.showModal();
  });
}
const LOGO = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="#E4502B" stroke-width="2.6"/><g fill="#E4502B" stroke="#E4502B" stroke-width="1.4" stroke-linejoin="round"><path d="M40 24.2 47.1 44.3 37.1 72.4 18.5 72.4Z"/><path d="M62.9 24.2 72.9 49.4 51.4 49.4Z"/><path d="M48.6 54.3 75.8 54.3 83 72.4 42.8 72.4Z"/></g></svg>';
const I = {
  plus:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  dl:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>',
  doc:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 1.8h5.5L12.5 5v9.2h-8.5z"/><path d="M9.3 2v3.2h3M6 8.2h4.5M6 10.8h4.5"/></svg>',
  clip:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4.5 5.2 9.8a1.6 1.6 0 0 0 2.3 2.3l5.6-5.6a3 3 0 0 0-4.2-4.2L3.3 7.9a4.4 4.4 0 0 0 6.2 6.2L14 9.6"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>',
  balanco:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 17h14M5 14V9M10 14V5M15 14v-3"/></svg>',
  fat:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 2.5h7l3 3v12H5z"/><path d="M8 9h5M8 12h5M8 15h3"/></svg>',
  rec:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M5.5 8v4M8 8v4M10 8v4M13 8v4M14.5 8v4"/></svg>',
  gas:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h14v9.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5z"/><path d="M3 6l2-3h10l2 3M8 10.5h4"/></svg>',
  cli:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="7" r="3"/><path d="M2.5 16.5c.7-3 3-4.5 5.5-4.5s4.8 1.5 5.5 4.5M13.5 4.2a3 3 0 0 1 0 5.6M15.5 12.5c1 .7 1.7 2 2 4"/></svg>',
  rel:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h12v14H4z"/><path d="M7 13V10M10 13V7M13 13v-4"/></svg>',
  cfg:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>'
};

/* ================= regras ================= */
const TIPOS = {manutencao: "Manutenção", fabricacao: "Fabricação"};
const CATS = ["Sistema / telefone / internet","Folha de pagamento","Gastos de entrega","Material de produção","Limpeza","Contabilidade","Energia","Água","Exames admissionais","Impostos","Transportadora","Compras online","Representante comercial","Documentação","Outros"];
function stParc(p){ if (p.pagoEm) return "pago"; return p.venc && p.venc < today() ? "atrasado" : "aberto"; }
const vPago = p => p.valorPago != null ? +p.valorPago : +p.valor;
function stFat(f){
  const ps = f.parcelas || []; if (!ps.length) return "aberto";
  const st = ps.map(stParc);
  if (st.every(s => s === "pago")) return "pago";
  if (st.includes("atrasado")) return "atrasado";
  return st.includes("pago") ? "parcial" : "aberto";
}
const ANX = {nf: "Nota fiscal", boleto: "Boleto", servico: "Nota de serviço / OS", outro: "Outro"};
const ANX_CURTO = {nf: "NF", boleto: "Boleto", servico: "Serviço", outro: "Arquivo"};
const MAX_ANX = 10 * 1024 * 1024;
const driveUrl = id => "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/view";
const tamTxt = n => n >= 1048576 ? (n / 1048576).toLocaleString("pt-BR", {maximumFractionDigits:1}) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const ST_LBL = {pago:"Pago", aberto:"Em aberto", atrasado:"Em atraso", parcial:"Parcial"};
const chip = st => `<span class="chip ${st}">${ST_LBL[st]}</span>`;

/* ================= estado ================= */
const LSD = "maartec.fin.dados", MODOK = "maartec.fin.modo", SRVK = "maartec.fin.servidor", TOKK = "maartec.fin.sessao", CACHEK = "maartec.fin.cache";
let S = vazio(), LIXO = {}, ultimoBackup = null, demo = null;
let mode = null, SERVER = null, TOK = null, versaoAtual = null, pinGate = false, pinMsg = "", trocarSrv = false, ready = false, offline = false, pend = 0, pollT = null;
const writeChain = {};
function vazio(){ return {clientes:{}, fats:{}, gastos:{}}; }
function D(){ return demo || S; }
const BK = {cliente:"clientes", fat:"fats", gasto:"gastos"};
const str = (v, n = 300) => (v == null ? "" : String(v)).slice(0, n);
const isoOk = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : "";
const idOk = v => typeof v === "string" && /^[A-Za-z0-9_-]{1,80}$/.test(v) ? v : "";
const nOk = v => { v = +v; return isFinite(v) ? r2(v) : 0; };
function cleanCli(o){ return {id: idOk(o.id), nome: str(o.nome, 120) || "Sem nome", doc: str(o.doc, 40), contato: str(o.contato, 160), obs: str(o.obs)}; }
function cleanFat(o){
  return {id: idOk(o.id), tipo: o.tipo === "fabricacao" ? "fabricacao" : "manutencao", clienteId: idOk(o.clienteId), orc: str(o.orc, 30), nf: str(o.nf, 40),
    emissao: isoOk(o.emissao), valor: Math.max(0, nOk(o.valor)), obs: str(o.obs),
    parcelas: (Array.isArray(o.parcelas) ? o.parcelas : []).slice(0, 60).map(p => { const x = {id: idOk(p.id) || uid("p"), venc: isoOk(p.venc), valor: Math.max(0, nOk(p.valor)), boleto: str(p.boleto, 40), enviado: !!p.enviado}; if (isoOk(p.pagoEm)){ x.pagoEm = p.pagoEm; if (p.valorPago != null && p.valorPago !== "") x.valorPago = nOk(p.valorPago); } return x; }),
    anexos: (Array.isArray(o.anexos) ? o.anexos : []).slice(0, 30).filter(a => a && /^[A-Za-z0-9_-]{10,100}$/.test(a.id)).map(a => ({id: a.id, tipo: ANX[a.tipo] ? a.tipo : "outro", nome: str(a.nome, 160) || "arquivo", mime: str(a.mime, 80), tam: Math.max(0, +a.tam || 0), em: str(a.em, 30)}))};
}
function cleanGasto(o){ return {id: idOk(o.id), desc: str(o.desc, 160) || "Gasto", cat: str(o.cat, 60) || "Outros", data: isoOk(o.data), valor: Math.max(0, nOk(o.valor)), pago: o.pago !== false, obs: str(o.obs)}; }
const CLEAN = {cliente: cleanCli, fat: cleanFat, gasto: cleanGasto};
function cleanAll(o){
  const out = vazio();
  Object.entries(BK).forEach(([k, b]) => Object.values((o && o[b]) || {}).forEach(x => { x = CLEAN[k](x); if (x.id) out[b][x.id] = x; }));
  return out;
}

function setSave(state, text){ const el = $("#save"); el.className = "save" + (state === "busy" ? " busy" : state === "err" ? " err" : ""); el.querySelector("span").textContent = text; el.title = text; }
const savedLabel = () => mode === "app" ? "Salvo na planilha" : "Salvo neste aparelho";

/* ----- modo local ----- */
function loadLocal(){ try { const raw = JSON.parse(localStorage.getItem(LSD) || "null"); if (raw){ S = cleanAll(raw); LIXO = raw.lixo || {}; ultimoBackup = raw.ultimoBackup || null; } } catch(e){} }
function saveLocal(){ if (mode !== "local") return; try { localStorage.setItem(LSD, JSON.stringify(Object.assign({}, S, {lixo: LIXO, ultimoBackup}))); setSave("ok", savedLabel()); } catch(e){ setSave("err", "Sem espaço no navegador — baixe um backup"); } }

/* ----- servidor (Google Planilha via Apps Script) ----- */
function lsGet(k){ try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v, sess){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); if (v != null) (sess ? sessionStorage : localStorage).setItem(k, v); } catch(e){} }
async function api(fn, ...args){
  let r;
  try { r = await fetch(SERVER, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({fn, args}), redirect:"follow"}); }
  catch(e){ throw new Error("rede"); }
  let j; try { j = await r.json(); } catch(e){ throw new Error("servidor"); }
  if (!j || !j.ok){ const m = (j && j.err) || "erro"; if (/sessao/.test(m)) setTimeout(() => voltarAoPin("Sua sessão terminou. Digite o PIN de novo."), 0); throw new Error(m); }
  return j.r;
}
let tCache = null;
function salvarCache(){ clearTimeout(tCache); tCache = setTimeout(() => { if (!TOK) return; try { localStorage.setItem(CACHEK, JSON.stringify({versao: versaoAtual, docs: docsDe()})); } catch(e){} }, 300); }
function docsDe(){
  const docs = [];
  Object.entries(BK).forEach(([k, b]) => Object.values(S[b]).forEach(o => docs.push({id: o.id, json: JSON.stringify(Object.assign({}, o, {kind: k}))})));
  Object.entries(LIXO).forEach(([id, o]) => docs.push({id, json: JSON.stringify(o)}));
  if (ultimoBackup) docs.push({id: "_backup", json: JSON.stringify({kind: "meta", em: ultimoBackup})});
  return docs;
}
function escrever(fn, ...a){ pend++; setSave("busy", "Salvando…"); return api(fn, TOK, ...a).then(r => { if (r && r.versao) versaoAtual = r.versao; salvarCache(); setSave("ok", savedLabel()); return r; }).catch(e => { const m = e.message === "rede" ? "Não foi salvo — sem conexão. Repita quando voltar." : "Não foi salvo — tente de novo"; setSave("err", m); toast(m); throw e; }).finally(() => pend--); }
function grava(id, body){ writeChain[id] = (writeChain[id] || Promise.resolve()).catch(() => {}).then(() => escrever("salvar", id, body)); return writeChain[id]; }
function apaga(id){ writeChain[id] = (writeChain[id] || Promise.resolve()).catch(() => {}).then(() => escrever("excluir", id)); return writeChain[id]; }
function aplicar(res, doCache){
  const raw = vazio(), lixo = {}, venceu = [], limite = Date.now() - 30 * 864e5;
  (res.docs || []).forEach(d => { let o; try { o = JSON.parse(d.json); } catch(e){ return; } if (!o || typeof o !== "object") return; const k = o.kind;
    if (BK[k] && idOk(d.id)){ o.id = d.id; raw[BK[k]][d.id] = o; }
    else if (k === "lixo" && o.orig && BK[o.origKind]){ if (Date.parse(o.excluidoEm) < limite) venceu.push(d.id); else lixo[d.id] = {kind:"lixo", origKind:o.origKind, excluidoEm: str(o.excluidoEm, 30), orig: CLEAN[o.origKind](o.orig)}; }
    else if (k === "meta" && d.id === "_backup") ultimoBackup = str(o.em, 30); });
  S = cleanAll(raw); LIXO = lixo; versaoAtual = res.versao; ready = true; render();
  if (doCache){ salvarCache(); venceu.forEach(id => apaga(id).catch(() => {})); }
}
async function carregar(){
  setSave("busy", "Sincronizando…");
  try { aplicar(await api("carregar", TOK), true); offline = false; setSave("ok", savedLabel()); }
  catch(e){
    if (/sessao/.test(e.message)) return;
    offline = true;
    const c = (() => { try { return JSON.parse(localStorage.getItem(CACHEK)); } catch(x){ return null; } })();
    if (c) aplicar(c, false); else { ready = true; render(); }
    setSave("err", "Sem internet — mostrando os últimos dados. Alterações só com conexão.");
  }
}
function vigiar(){
  clearInterval(pollT);
  pollT = setInterval(async () => {
    if (!TOK || pend || document.hidden || $("#dlg").open) return;
    try { const v = await api("versao", TOK); if ((v !== versaoAtual || offline) && !pend) await carregar(); } catch(e){}
  }, 15000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "app" && TOK && !pend && ready) carregar(); });
const srvOk = u => /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(u);
async function entrarComPin(pin, lembrar, srv){
  if (srv != null){ srv = srv.trim(); if (!srvOk(srv)){ pinMsg = "Endereço inválido. Ele começa com https://script.google.com/macros/s/ e termina com /exec."; render(); return; } SERVER = srv; }
  if (!SERVER){ pinMsg = "Informe o endereço do servidor."; render(); return; }
  pinMsg = "Entrando…"; render();
  let r; try { r = await api("entrar", pin, !!lembrar); } catch(e){ pinMsg = e.message === "rede" ? "Sem conexão com o servidor. Confira a internet e o endereço." : "O servidor não respondeu direito. Confira se a implantação está com acesso \"Qualquer pessoa\"."; render(); return; }
  if (!r || !r.ok){ pinMsg = (r && r.msg) || "PIN incorreto."; render(); const i = $("#pin"); if (i){ i.value = ""; i.focus(); } return; }
  mode = "app"; lsSet(MODOK, "app"); lsSet(SRVK, SERVER); TOK = r.token; lsSet(TOKK, TOK, !lembrar);
  pinGate = false; trocarSrv = false; pinMsg = ""; ready = false; render(); await carregar(); vigiar();
}
function voltarAoPin(msg){
  TOK = null; lsSet(TOKK, null); lsSet(CACHEK, null); clearInterval(pollT);
  S = vazio(); LIXO = {}; mode = null; pinGate = true; pinMsg = msg || ""; ready = true; try { if ($("#dlg").open) $("#dlg").close(); } catch(e){} render();
}
function sair(){

function persist(kind, obj){
  obj = CLEAN[kind](obj);
  if (demo){ demo[BK[kind]][obj.id] = obj; render(); return obj; }
  S[BK[kind]][obj.id] = obj; render();
  if (mode === "local") saveLocal(); else grava(obj.id, Object.assign({}, obj, {kind})).catch(() => {});
  return obj;
}
function removeItem(kind, id){
  if (demo){ delete demo[BK[kind]][id]; render(); return; }
  const orig = S[BK[kind]][id]; if (!orig) return;
  delete S[BK[kind]][id];
  const lx = {kind:"lixo", origKind: kind, orig: JSON.parse(JSON.stringify(orig)), excluidoEm: new Date().toISOString()};
  LIXO["lx_" + id] = lx; render();
  if (mode === "local") return saveLocal();
  grava("lx_" + id, lx).then(() => apaga(id)).catch(() => {});
}
function restaurar(lxId){
  const lx = LIXO[lxId]; if (!lx) return;
  delete LIXO[lxId]; persist(lx.origKind, lx.orig);
  if (lx.origKind === "fat" && lx.orig.clienteId && !S.clientes[lx.orig.clienteId] && LIXO["lx_" + lx.orig.clienteId]) restaurar("lx_" + lx.orig.clienteId);

// números de um período [a, b]
function resumo(a, b){
  const r = {man:0, fab:0, fat:0, desp:0, lucro:0, entrou:0, entrouMes:0, entrouOutros:0, vaiEntrar:0, atrasado:0, aVencer:0, previsto:0, sobrou:0, sobraTotal:0, gastoPend:0, nFat:0, nGas:0, cats:{}, porCli:{}};
  fats().forEach(f => {
    if (inR(f.emissao, a, b)){ r[f.tipo === "fabricacao" ? "fab" : "man"] += f.valor; r.nFat++; r.porCli[f.clienteId] = (r.porCli[f.clienteId] || 0) + f.valor; }
    (f.parcelas||[]).forEach(p => {
      if (p.pagoEm && inR(p.pagoEm, a, b)){ const v = vPago(p); r.entrou += v; if (inR(f.emissao, a, b)) r.entrouMes += v; else r.entrouOutros += v; }
      if (!p.pagoEm && p.venc && p.venc <= b){ r.vaiEntrar += p.valor; if (p.venc < today()) r.atrasado += p.valor; else r.aVencer += p.valor; }
    });
  });
  gastos().forEach(g => { if (inR(g.data, a, b)){ r.desp += g.valor; r.nGas++; r.cats[g.cat] = (r.cats[g.cat] || 0) + g.valor; if (!g.pago) r.gastoPend += g.valor; } });
  r.fat = r.man + r.fab; r.lucro = r.fat - r.desp; r.previsto = r.entrou + r.vaiEntrar; r.sobrou = r.entrou - r.desp; r.sobraTotal = r.sobrou + r.vaiEntrar;
  Object.keys(r).forEach(k => { if (typeof r[k] === "number") r[k] = r2(r[k]); });
  return r;
}

/* ---------- gráfico ---------- */
const periodoGraf = matchMedia("(max-width:600px)").matches ? 6 : 12;
let serie = [];
function chartHTML(){
  const ks = []; for (let i = periodoGraf - 1; i >= 0; i--) ks.push(addMonthsK(mes, -i));
  serie = ks.map(k => { const r = resumo(firstDay(k), lastDay(k)); return {k, fat: r.fat, desp: r.desp, lucro: r.lucro}; });
  const W = 600, H = 240, L = 54, R = 8, T = 10, B = 26, n = serie.length;
  const max = Math.max(1, ...serie.map(s => Math.max(s.fat, s.desp)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max / step) * step; const yMax = nice;
  const y = v => T + (H - T - B) * (1 - v / yMax); const gw = (W - L - R) / n; const bw = Math.min(16, (gw - 10) / 2);
  const ticks = [0, .25, .5, .75, 1].map(f => yMax * f);
  const kfmt = v => v >= 1e6 ? (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi" : v >= 1e3 ? (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil" : String(v);
  const barP = (x, v) => { const h = Math.max(0, y(0) - y(v)); if (h < .5) return ""; const rr = Math.min(4, h, bw/2); const yt = y(v); return `M${x},${y(0)}V${yt+rr}Q${x},${yt} ${x+rr},${yt}H${x+bw-rr}Q${x+bw},${yt} ${x+bw},${yt+rr}V${y(0)}Z`; };
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Faturamento</span><span><i style="background:var(--s2)"></i>Despesas</span></div>
  <div class="chart" id="chartWrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento e despesas por mês">
  ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(t)}</text>`).join("")}
  ${serie.map((s, i) => { const cx = L + gw * i + gw / 2; return `<g class="money"><path d="${barP(cx - bw - 1, s.fat)}" fill="var(--s1)"/><path d="${barP(cx + 1, s.desp)}" fill="var(--s2)"/></g><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${s.k === mes ? "var(--ink)" : "var(--muted)"}" font-weight="${s.k === mes ? 600 : 400}">${mesCurto(s.k)}</text><rect data-i="${i}" x="${L + gw*i}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent"/>`; }).join("")}
  <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1.5"/>
  </svg><div class="tip" id="tip"></div></div>
  <details class="small" style="margin-top:8px"><summary class="muted" style="cursor:pointer">Ver em tabela</summary><table class="sheet" style="margin-top:8px"><thead><tr><th>Mês</th><th class="r">Faturamento</th><th class="r">Despesas</th><th class="r">Lucro</th></tr></thead><tbody>${serie.map(s => `<tr><td>${mesCurto(s.k)}</td><td class="r">${m$(s.fat)}</td><td class="r">${m$(s.desp)}</td><td class="r ${s.lucro<0?"neg":""}">${m$(s.lucro)}</td></tr>`).join("")}</tbody></table></details>`;
}
function wireChart(){
  const w = $("#chartWrap"), tip = $("#tip"); if (!w) return;
  w.querySelectorAll("rect[data-i]").forEach(rc => {
    const show = () => { const s = serie[+rc.dataset.i]; const bb = rc.getBoundingClientRect(), wb = w.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(mesNome(s.k))}</b><br>Faturamento: ${discreto ? "•••" : brl(s.fat)}<br>Despesas: ${discreto ? "•••" : brl(s.desp)}<br>Lucro: ${discreto ? "•••" : brl(s.lucro)}`;
      tip.style.left = Math.min(wb.width - 90, Math.max(90, bb.left - wb.left + bb.width / 2)) + "px"; tip.style.top = "40px"; tip.classList.add("on"); };
    rc.addEventListener("mouseenter", show); rc.addEventListener("click", show);
    rc.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
}

/* ---------- Relatórios (período livre) ---------- */
let perA = firstDay(today().slice(0,7)), perB = lastDay(today().slice(0,7)), perPreset = "mes";
function presetRange(p){
  const t = today(), k = t.slice(0,7), y = +t.slice(0,4), mm = +t.slice(5,7);
  if (p === "mes") return [firstDay(mes), lastDay(mes)];
  if (p === "mesant") return [firstDay(addMonthsK(k,-1)), lastDay(addMonthsK(k,-1))];
  if (p === "tri"){ const q0 = Math.floor((mm-1)/3)*3+1; const s = y + "-" + pad(q0); return [firstDay(s), lastDay(addMonthsK(s,2))]; }
  if (p === "6m") return [firstDay(addMonthsK(k,-5)), lastDay(k)];
  if (p === "ano") return [y + "-01-01", y + "-12-31"];
  if (p === "anoant") return [(y-1) + "-01-01", (y-1) + "-12-31"];
  return [perA, perB];
}
function vRelatorios(){

const dlgShell = (title, body, submit, left) => `<form method="dialog" id="frm" autocomplete="off"><div class="dlg-head"><h2>${title}</h2><button type="button" class="x" data-act="close-dlg" aria-label="Fechar">×</button></div><div class="dlg-body">${body}</div><div class="dlg-foot">${left ? `<span class="left">${left}</span>` : ""}<button type="button" class="btn ghost" data-act="close-dlg">Cancelar</button><button class="btn primary" type="submit">${submit}</button></div></form>`;

function ensureCliNome(nome){ const ex = Object.values(D().clientes).find(c => norm(c.nome) === norm(nome)); return ex ? ex.id : ""; }
function lerBase64(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("leitura")); r.readAsDataURL(file); }); }
async function enviarAnexo(file, tipo, f){
  const b64 = await lerBase64(file);
  const meta = {tipo, nome: file.name, mime: file.type || "application/octet-stream", cliente: f.clienteId ? cliName(f.clienteId) : "", nf: f.nf || "", mes: (f.emissao || today()).slice(0, 7), fatId: f.id};
  pend++;
  try { const r = await api("anexar", TOK, meta, b64); return {id: r.id, tipo, nome: r.nome || file.name, mime: meta.mime, tam: file.size, em: new Date().toISOString()}; }
  finally { pend--; }
}
function abrirAnexo(a){ window.open(driveUrl(a.id), "_blank", "noopener"); }
async function baixarAnexo(a){
  if (mode !== "app" || !TOK){ abrirAnexo(a); return; }

}

async function saveFile(nome, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  try {
    if (navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent)){ const file = new File([blob], nome, {type: mime}); if (navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: nome}); return; } }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

  if (demo){ toast("Saia do exemplo para baixar o backup"); return; }

}
function importarBackup(file){

    const d = cleanAll(o.dados || o); const n = Object.keys(d.fats).length + Object.keys(d.gastos).length + Object.keys(d.clientes).length;

    toast("Backup importado");
  };
  rd.readAsText(file);
}

    ...sheets.map((s, i) => [`xl/worksheets/sheet${i+1}.xml`, sheetXML(s[1], s[2])])
  ];
  return zipStore(files);
}
function baixarPlanilha(a, b){
  if (!a || !b || a > b){ toast("Período inválido"); return; }
  saveFile(nomeArq(a, b, "xlsx"), planilha(a, b), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); toast("Planilha gerada");
}
window.__maartec = {planilha, relatorioCorpo, resumo};

/* ================= dados de exemplo ================= */
function makeDemo(){
  const d = vazio(); let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const nomes = ["Hospital Santa Clara","Clínica Ortoplan","Orthoserv Distribuidora","Traumed","Glid Hospitalar","Axis Med","Ortomédica","L&C Cirúrgica"];
  nomes.forEach((n, i) => d.clientes["c" + i] = cleanCli({id: "c" + i, nome: n, contato: "(81) 9" + (8000 + i*111) + "-" + (1000 + i*37)}));
  const hoje = today().slice(0,7); let orc = 9600, nf = 410, bol = 3800;
  for (let m = -5; m <= 0; m++){
    const k = addMonthsK(hoje, m);
    for (let j = 0; j < 9; j++){
      const tipo = j % 3 === 0 ? "fabricacao" : "manutencao", em = k + "-" + pad(2 + Math.floor(rnd() * 24));
      const valor = r2(tipo === "fabricacao" ? 2500 + rnd() * 9000 : 120 + rnd() * 1400), n = tipo === "fabricacao" && rnd() > .5 ? 2 : 1;
      const ps = []; for (let i = 0; i < n; i++){ const venc = addDays(em, 21 + 30 * i); const p = {id: uid("p"), venc, valor: r2(valor / n), boleto: "000000" + (bol++), enviado: true}; if (venc < today() && rnd() > .15) p.pagoEm = addDays(venc, Math.floor(rnd() * 5)); ps.push(p); }
      const id = "f" + m + "_" + j; d.fats[id] = cleanFat({id, tipo, clienteId: "c" + Math.floor(rnd() * nomes.length), orc: String(orc++), nf: "26000000" + (nf++), emissao: em, valor, parcelas: ps});
    }
    [["Folha de pagamento","Folha de pagamento",11000],["Energia","Energia",2100],["Água","Água",600],["Contabilidade","Contabilidade",1100],["Internet","Sistema / telefone / internet",250],["VoIP","Sistema / telefone / internet",210],["Gasto de entrega","Gastos de entrega",400],["Material de produção","Material de produção",3200],["Limpeza","Limpeza",500],["Receita Federal","Impostos",2400],["Compras online","Compras online",700]].forEach(([desc, cat, base], i) => {
      const id = "g" + m + "_" + i; const dt = k + "-" + pad(4 + i * 2); d.gastos[id] = cleanGasto({id, desc, cat, data: dt, valor: r2(base * (.85 + rnd() * .3)), pago: dt <= today()});
    });
  }
  return d;
}

/* ================= eventos ================= */
document.addEventListener("click", e => {
  const ao = e.target.closest("[data-anx-open]"); if (ao){ e.stopPropagation(); const [fid, aid] = ao.dataset.anxOpen.split("|"); const f = D().fats[fid]; const a = f && (f.anexos || []).find(x => x.id === aid); if (a) abrirAnexo(a); return; }
  const vb = e.target.closest("[data-view]"); if (vb){ view = vb.dataset.view; q = ""; render(); window.scrollTo(0, 0); return; }
  const tb = e.target.closest("[data-tipo]"); if (tb){ fTipo = tb.dataset.tipo; render(); return; }
  const rf = e.target.closest("[data-rf]"); if (rf){ rFiltro = rf.dataset.rf; render(); return; }
  const env = e.target.closest("[data-env]"); if (env){ e.stopPropagation(); const f = JSON.parse(JSON.stringify(D().fats[env.dataset.env])); const on = !(f.parcelas.length && f.parcelas.every(p => p.enviado)); f.parcelas.forEach(p => p.enviado = on); persist("fat", f); return; }
  const pe = e.target.closest("[data-penv]"); if (pe){ const [fid, pid] = pe.dataset.penv.split("|"); const f = JSON.parse(JSON.stringify(D().fats[fid])); const p = f.parcelas.find(x => x.id === pid); if (p){ p.enviado = !p.enviado; persist("fat", f); } return; }
  const pg = e.target.closest("[data-pagar]"); if (pg){ const [fid, pid] = pg.dataset.pagar.split("|"); togglePagar(fid, pid); return; }
  const gp = e.target.closest("[data-gpago]"); if (gp){ e.stopPropagation(); const g = Object.assign({}, D().gastos[gp.dataset.gpago]); g.pago = !g.pago; persist("gasto", g); return; }
  const rs = e.target.closest("[data-restaurar]"); if (rs){ restaurar(rs.dataset.restaurar); return; }
  const fr = e.target.closest("tr[data-fat]"); if (fr){ fatForm(D().fats[fr.dataset.fat]); return; }
  const gr = e.target.closest("tr[data-gasto]"); if (gr){ gastoForm(D().gastos[gr.dataset.gasto]); return; }
  const cr = e.target.closest("tr[data-cli]"); if (cr){ cliForm(D().clientes[cr.dataset.cli]); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  switch (b.dataset.act){
    case "close-dlg": closeDlg(); break;
    case "mes-ant": mes = addMonthsK(mes, -1); render(); break;
    case "mes-prox": mes = addMonthsK(mes, 1); render(); break;
    case "nova-fat": fatForm(null); break;
    case "novo-cli": cliForm(null); break;
    case "copiar-fixos": copiarFixos(); break;
    case "discreto": discreto = !discreto; try { localStorage.setItem("maartec.fin.discreto", discreto ? "1" : "0"); } catch(x){} document.body.classList.toggle("discreto", discreto); render(); break;
    case "rel-mes": abrirRelatorio(firstDay(mes), lastDay(mes)); break;
    case "xlsx-mes": baixarPlanilha(firstDay(mes), lastDay(mes)); break;
    case "rel-per": abrirRelatorio(perA, perB); break;
    case "xlsx-per": baixarPlanilha(perA, perB); break;
    case "xlsx-rep": baixarPlanilha(repA, repB); break;
    case "rel-html": baixarRelatorioHTML(repA && $("#rep") ? repA : perA, repB && $("#rep") ? repB : perB); break;
    case "rep-print": try { window.print(); } catch(x){ toast("Use “Baixar como página” e imprima pelo arquivo"); } break;
    case "rep-close": fecharRelatorio(); break;
    case "bk-down": baixarBackup(); break;
    case "sair": sair(); break;
    case "trocar-srv": trocarSrv = true; pinMsg = ""; render(); break;
    case "usar-local": usarLocal(); break;
    case "tema": $("#themeBtn").click(); break;
    case "demo": demo = makeDemo(); q = ""; view = "balanco"; mes = today().slice(0,7); render(); break;
    case "sair-demo": demo = null; q = ""; render(); if (mode) setSave("ok", savedLabel()); break;
    case "limpar": q = ""; fTipo = ""; fSt = ""; fPer = "mes"; render(); break;
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "pinfrm"){ e.preventDefault(); const v = $("#pin").value.trim(), sv = $("#srv"); if (v) entrarComPin(v, $("#lembrar").checked, sv ? sv.value : null); return; }
  if (e.target.id === "quick"){
    e.preventDefault(); const F = e.target.elements; const valor = num(F.valor.value);
    if (valor <= 0){ toast("Informe o valor"); F.valor.focus(); return; }
    persist("gasto", {id: uid("g"), desc: F.desc.value.trim(), cat: F.cat.value.trim(), data: F.data.value, valor, pago: F.pago.checked, obs: ""});
    toast("Gasto lançado"); const d = $("#quick [name=desc]"); if (d) d.focus();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[tabindex]")) e.target.click(); if (e.key === "Escape" && $("#rep")) fecharRelatorio(); });
document.addEventListener("input", e => { if (e.target.id === "q"){ q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#q"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.filter){ if (t.dataset.filter === "st") fSt = t.value; else fPer = t.value; render(); return; }
  if (t.id === "perPreset"){ perPreset = t.value; render(); return; }
  if (t.id === "perA" || t.id === "perB"){ perPreset = "livre"; if (t.id === "perA") perA = t.value; else perB = t.value; render(); return; }
  if (t.id === "bkFile" && t.files[0]){ importarBackup(t.files[0]); t.value = ""; }
});

const root = document.documentElement;
function applyTheme(t){ if (t) root.setAttribute("data-theme", t); else root.removeAttribute("data-theme"); const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; $("#themeBtn").textContent = dark ? "Tema claro" : "Tema escuro"; }
let theme = null; try { theme = localStorage.getItem("maartec.fin.tema"); } catch(e){}
applyTheme(theme);

document.querySelector(".brand").insertAdjacentHTML("afterbegin", LOGO);
connect();
